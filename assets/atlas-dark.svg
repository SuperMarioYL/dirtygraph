<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：源文件 → 依赖图 → 脏标记闭包 → 仅重算脏子图">
  <defs>
    <marker id="ad-ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <!-- stage connectors -->
  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="206" y1="172" x2="246" y2="172" marker-end="url(#ad-ah)"/>
    <line x1="452" y1="172" x2="492" y2="172" marker-end="url(#ad-ah)"/>
    <line x1="658" y1="172" x2="698" y2="172" marker-end="url(#ad-ah)"/>
  </g>

  <!-- title -->
  <text x="40" y="44" font-size="15" font-weight="700" fill="#F5F5F7">DirtyGraph · 增量失效流水线</text>
  <text x="40" y="66" font-size="12" font-weight="500" fill="#A1A1A8">编辑一个源文件 → 只把派生它的节点标脏 → 沿关系边算闭包 → 仅重算脏子图</text>

  <!-- STAGE 1 — source files (input you bring) -->
  <g>
    <rect x="40" y="108" width="166" height="130" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="123" y="134" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9FCBFF">已有知识图谱</text>
    <text x="123" y="154" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">graphify graph.json</text>
    <text x="123" y="170" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">code-review-graph SQLite</text>
    <text x="123" y="200" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9FCBFF">node.source_file</text>
    <text x="123" y="216" text-anchor="middle" font-size="10.5" font-weight="500" fill="#A1A1A8">+ 代码关系边</text>
  </g>

  <!-- STAGE 2 — depgraph + store (sidecar) -->
  <g>
    <rect x="246" y="108" width="206" height="130" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="349" y="132" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9FCBFF">store + depgraph</text>
    <text x="349" y="152" text-anchor="middle" font-size="10.5" font-weight="500" fill="#A1A1A8">.dirtygraph/state.json sidecar</text>
    <!-- mini blake3 sidecar rows -->
    <g font-size="10" font-weight="500" fill="#A1A1A8">
      <rect x="266" y="164" width="166" height="20" rx="6" fill="#2A2A2E" fill-opacity="0.8" stroke="#3A3A44" stroke-width="1"/>
      <text x="276" y="178">node → source_path · blake3 hash</text>
      <rect x="266" y="190" width="166" height="20" rx="6" fill="#2A2A2E" fill-opacity="0.8" stroke="#3A3A44" stroke-width="1"/>
      <text x="276" y="204">DiGraph：把关系边当传播边</text>
    </g>
    <text x="349" y="228" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9FCBFF">init / add / link</text>
  </g>

  <!-- STAGE 3 — dirty marking (forward closure) -->
  <g>
    <rect x="492" y="108" width="166" height="130" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5"/>
    <text x="575" y="132" text-anchor="middle" font-size="13.5" font-weight="700" fill="#BDB9FF">dirty 标记</text>
    <text x="575" y="152" text-anchor="middle" font-size="10.5" font-weight="500" fill="#A1A1A8">blake3 比对 → 变更文件</text>
    <!-- tiny closure graph -->
    <g>
      <circle cx="528" cy="186" r="11" fill="#8985FF" fill-opacity="0.24" stroke="#8985FF" stroke-width="1.4"/>
      <circle cx="575" cy="186" r="11" fill="#8985FF" fill-opacity="0.24" stroke="#8985FF" stroke-width="1.4"/>
      <circle cx="622" cy="186" r="11" fill="#3A3A44" fill-opacity="0.3" stroke="#3A3A44" stroke-width="1.4" stroke-dasharray="3 3"/>
      <line x1="539" y1="186" x2="564" y2="186" stroke="#8985FF" stroke-width="1.4" marker-end="url(#ad-ah)"/>
    </g>
    <text x="575" y="222" text-anchor="middle" font-size="10.5" font-weight="600" fill="#BDB9FF">前向可达闭包 = 脏集</text>
  </g>

  <!-- STAGE 4 — rederive only dirty subgraph -->
  <g>
    <rect x="698" y="108" width="142" height="130" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5"/>
    <text x="769" y="132" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7FE3C8">rederive</text>
    <text x="769" y="152" text-anchor="middle" font-size="10.5" font-weight="500" fill="#A1A1A8">拓扑序遍历脏子图</text>
    <text x="769" y="172" text-anchor="middle" font-size="10.5" font-weight="500" fill="#A1A1A8">codegraph adapter</text>
    <text x="769" y="190" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">echo · DeepSeek · Qwen</text>
    <rect x="714" y="200" width="110" height="24" rx="8" fill="#2DC79A" fill-opacity="0.2" stroke="#2DC79A" stroke-width="1.1"/>
    <text x="769" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#7FE3C8">重算 3 / 1,203</text>
  </g>

  <!-- watchdog loop annotation -->
  <g>
    <path d="M123 238 C 123 300, 575 300, 575 238" stroke="#6E6E73" stroke-width="1.3" stroke-dasharray="4 4" fill="none" marker-end="url(#ad-ah)"/>
    <rect x="300" y="284" width="190" height="26" rx="13" fill="#1D1D1F" stroke="#3A3A44" stroke-width="1.1"/>
    <text x="395" y="301" text-anchor="middle" font-size="11" font-weight="600" fill="#A1A1A8">watch · watchdog 实时文件事件</text>
  </g>
</svg>
