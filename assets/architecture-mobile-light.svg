<svg xmlns="http://www.w3.org/2000/svg" width="400" height="712" viewBox="0 0 400 712" role="img" aria-labelledby="architecture-mobile-light-title architecture-mobile-light-desc">
<title id="architecture-mobile-light-title">DirtyGraph architecture</title><desc id="architecture-mobile-light-desc">Narrow layout of the architecture figure; all relationships remain visible.</desc>
<defs><linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="400"><stop stop-color="#2875c9"/><stop offset=".48" stop-color="#5855ca"/><stop offset="1" stop-color="#8050c5"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#b5c1ff" stop-opacity=".32"/><stop offset="1" stop-color="#f5f7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c5d0ef" stroke-opacity=".4" stroke-width=".6"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#829aff" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:Arial,'Noto Sans',sans-serif;fill:#12214a}.muted{fill:#53668d}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.panel{fill:#ffffff;stroke:#c5d0ef;stroke-width:1}.wire{fill:none;stroke:#c5d0ef;stroke-width:1.2}.active{fill:none;stroke:url(#neon);stroke-width:1.6}.flow{fill:none;stroke:#7ed9ff;stroke-width:2;stroke-dasharray:12 240;animation:flow 6s linear infinite}.glimmer{animation:glimmer 6s ease-in-out infinite}.gather{animation:gather 2.8s cubic-bezier(.2,.7,.2,1) both}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 40s linear infinite}@keyframes flow{to{stroke-dashoffset:-504}}@keyframes glimmer{0%,100%{opacity:.3}45%,65%{opacity:1}}@keyframes gather{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.flow{display:none}}
</style><rect width="400" height="712" rx="16" fill="#f5f7ff"/><rect width="400" height="712" rx="16" fill="url(#grid)"/><ellipse cx="231.99999999999997" cy="284.8" rx="208.0" ry="512.64" fill="url(#haze)"/>
<text x="24" y="42" font-size="11" class="muted mono" >THE INCREMENTAL ENGINE</text><text x="24" y="80" font-size="27" class="" font-weight="600">From edit to update.</text><path d="M106 188V244" class="active" marker-end="url(#arrow)"/><path d="M106 188V244" class="flow" aria-hidden="true"/><path d="M294 188V244" class="active" marker-end="url(#arrow)"/><path d="M294 188V244" class="flow" aria-hidden="true"/><path d="M212 280H188" class="active" marker-end="url(#arrow)"/><path d="M212 280H188" class="flow" aria-hidden="true"/><path d="M106 316V388" class="active" marker-end="url(#arrow)"/><path d="M106 316V388" class="flow" aria-hidden="true"/><path d="M106 460V524" class="active" marker-end="url(#arrow)"/><path d="M106 460V524" class="flow" aria-hidden="true"/><path d="M294 460V524" class="active" marker-end="url(#arrow)"/><path d="M294 460V524" class="flow" aria-hidden="true"/><rect x="24" y="116" width="164" height="72" rx="10" class="panel"/><text x="40" y="144" font-size="17" class="" font-weight="600">Existing graph</text><text x="40" y="168" font-size="12" class="muted mono" >JSON / SQLite</text><rect x="212" y="116" width="164" height="72" rx="10" class="panel"/><text x="228" y="144" font-size="17" class="" font-weight="600">Source files</text><text x="228" y="168" font-size="12" class="muted mono" >File provenance</text><rect x="24" y="244" width="164" height="72" rx="10" class="panel"/><text x="40" y="272" font-size="17" class="" font-weight="600">DepGraph + dirty</text><text x="40" y="296" font-size="12" class="muted mono" >Dirty closure</text><rect x="212" y="244" width="164" height="72" rx="10" class="panel"/><text x="228" y="272" font-size="17" class="" font-weight="600">BLAKE3</text><text x="228" y="296" font-size="12" class="muted mono" >Hash detection</text><rect x="24" y="388" width="352" height="72" rx="10" class="panel"/><text x="40" y="416" font-size="17" class="" font-weight="600">Rederive engine</text><text x="40" y="440" font-size="12" class="muted mono" >Topological calls → adapter</text><rect x="24" y="524" width="164" height="72" rx="10" class="panel"/><text x="40" y="552" font-size="17" class="" font-weight="600">Store</text><text x="40" y="576" font-size="12" class="muted mono" >Checkpoints</text><rect x="212" y="524" width="164" height="72" rx="10" class="panel"/><text x="228" y="552" font-size="17" class="" font-weight="600">Application</text><text x="228" y="576" font-size="12" class="muted mono" >Persist results</text><text x="24" y="646" font-size="14" class="muted" >Store supplies hashes for the next check.</text><text x="24" y="674" font-size="14" class="muted" >Failed adapter calls leave nodes dirty.</text></svg>