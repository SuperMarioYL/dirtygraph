font-size="20" class="" font-weight="600">graphify</text><text x="60" y="198" font-size="13" class="muted mono" >node-link JSON</text><rect x="40" y="244" width="248" height="72" rx="10" class="panel"/><text x="60" y="276" font-size="20" class="" font-weight="600">code-review-graph</text><text x="60" y="301" font-size="13" class="muted mono" >SQLite</text><rect x="40" y="347" width="248" height="72" rx="10" class="panel"/><text x="60" y="379" font-size="20" class="" font-weight="600">Manual wiring</text><text x="60" y="404" font-size="13" class="muted mono" >add / link</text><rect x="712" y="141" width="248" height="72" rx="10" class="panel"/><text x="732" y="173" font-size="20" class="" font-weight="600">Local</text><text x="732" y="198" font-size="13" class="muted mono" >echo / codegraph</text><rect x="712" y="244" width="248" height="72" rx="10" class="panel"/><text x="732" y="276" font-size="20" class="" font-weight="600">OpenAI-compatible</text><text x="732" y="301" font-size="13" class="muted mono" >DeepSeek / Qwen config</text><rect x="712" y="347" width="248" height="72" rx="10" class="panel"/><text x="732" y="379" font-size="20" class="" font-weight="600">Custom adapter</text><text x="732" y="404" font-size="13" class="muted mono" >Python · re_derive()</text></svg>