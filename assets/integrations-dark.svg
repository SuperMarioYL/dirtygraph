<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="integrations-dark-title integrations-dark-desc">
<title id="integrations-dark-title">Supported integration paths</title><desc id="integrations-dark-desc">Read graphify JSON, code-review-graph SQLite or manually registered nodes. Re-derive with local, optional OpenAI-compatible, or custom Python adapters.</desc>
<defs><linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="400"><stop stop-color="#55c8ff"/><stop offset=".48" stop-color="#7489ff"/><stop offset="1" stop-color="#a879ff"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#4e49c6" stop-opacity=".32"/><stop offset="1" stop-color="#050817" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23355b" stroke-opacity=".4" stroke-width=".6"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#829aff" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:Arial,'Noto Sans',sans-serif;fill:#eef2ff}.muted{fill:#91a1c6}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.panel{fill:#0b122b;stroke:#23355b;stroke-width:1}.wire{fill:none;stroke:#23355b;stroke-width:1.2}.active{fill:none;stroke:url(#neon);stroke-width:1.6}.flow{fill:none;stroke:#7ed9ff;stroke-width:2;stroke-dasharray:12 240;animation:flow 6s linear infinite}.glimmer{animation:glimmer 6s ease-in-out infinite}.gather{animation:gather 2.8s cubic-bezier(.2,.7,.2,1) both}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 40s linear infinite}@keyframes flow{to{stroke-dashoffset:-504}}@keyframes glimmer{0%,100%{opacity:.3}45%,65%{opacity:1}}@keyframes gather{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.flow{display:none}}
</style><rect width="1000" height="470" rx="16" fill="#050817"/><rect width="1000" height="470" rx="16" fill="url(#grid)"/><ellipse cx="580.0" cy="188.0" rx="520.0" ry="338.4" fill="url(#haze)"/>
