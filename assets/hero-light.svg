<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="DirtyGraph — 给 Agent 代码知识图谱接上 Bazel 式脏标记">
  <defs>
    <linearGradient id="hl-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0071E3" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#5E5CE6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="hl-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0071E3"/>
      <stop offset="0.62" stop-color="#3D6BE0"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
    <marker id="hl-ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="300" fill="#F5F5F7"/>
  <rect x="0" y="0" width="880" height="300" fill="url(#hl-wash)"/>

  <!-- left: wordmark + tagline -->
  <text x="64" y="118" font-size="58" font-weight="800" fill="url(#hl-name)" letter-spacing="-1.5">DirtyGraph</text>
  <text x="66" y="160" font-size="18" font-weight="600" fill="#1D1D1F">给 Agent 代码知识图谱接上 Bazel 式脏标记</text>
  <text x="66" y="190" font-size="14.5" font-weight="500" fill="#6E6E73">文件一改，只重算受影响的脏闭包 —— 而不是整库重扫</text>

  <!-- pills -->
  <g font-size="12.5" font-weight="600">
    <rect x="66" y="214" width="118" height="28" rx="14" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.2"/>
    <text x="125" y="232.5" text-anchor="middle" fill="#0A4F9E">脏闭包传播</text>
    <rect x="196" y="214" width="132" height="28" rx="14" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.2"/>
    <text x="262" y="232.5" text-anchor="middle" fill="#4B3FC4">DeepSeek / Qwen</text>
    <rect x="340" y="214" width="96" height="28" rx="14" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.2"/>
    <text x="388" y="232.5" text-anchor="middle" fill="#0B6B53">增量重算</text>
  </g>

  <!-- right: the benchmark payoff, a mini dirty-closure graph -->
  <g transform="translate(584,52)">
    <rect x="0" y="0" width="248" height="196" rx="18" fill="#FFFFFF" fill-opacity="0.66" stroke="#C9C9D0" stroke-width="1.3"/>

    <!-- edges -->
    <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
      <line x1="60" y1="58" x2="60" y2="98" marker-end="url(#hl-ah)"/>
      <line x1="60" y1="120" x2="60" y2="148" marker-end="url(#hl-ah)"/>
      <line x1="84" y1="46" x2="168" y2="46" marker-end="url(#hl-ah)"/>
    </g>

    <!-- dirty (re-derived) nodes -->
    <g>
      <circle cx="60" cy="40" r="17" fill="#5E5CE6" fill-opacity="0.16" stroke="#5E5CE6" stroke-width="1.6"/>
      <circle cx="60" cy="110" r="17" fill="#5E5CE6" fill-opacity="0.16" stroke="#5E5CE6" stroke-width="1.6"/>
      <circle cx="60" cy="166" r="17" fill="#5E5CE6" fill-opacity="0.16" stroke="#5E5CE6" stroke-width="1.6"/>
    </g>
    <!-- clean node -->
    <circle cx="186" cy="46" r="16" fill="#10A37F" fill-opacity="0.0" stroke="#C9C9D0" stroke-width="1.5" stroke-dasharray="3 3"/>

    <text x="124" y="186" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0B6B53">re-derived 3 of 1,203</text>
  </g>
</svg>
