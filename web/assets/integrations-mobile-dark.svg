<svg xmlns="http://www.w3.org/2000/svg" width="400" height="740" viewBox="0 0 400 740" role="img" aria-labelledby="integrations-mobile-dark-title integrations-mobile-dark-desc">
<title id="integrations-mobile-dark-title">DirtyGraph integrations</title><desc id="integrations-mobile-dark-desc">Narrow layout of the integrations figure; all relationships remain visible.</desc>
<defs><linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="400"><stop stop-color="#55c8ff"/><stop offset=".48" stop-color="#7489ff"/><stop offset="1" stop-color="#a879ff"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#4e49c6" stop-opacity=".32"/><stop offset="1" stop-color="#050817" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23355b" stroke-opacity=".4" stroke-width=".6"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#829aff" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:Arial,'Noto Sans',sans-serif;fill:#eef2ff}.muted{fill:#91a1c6}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.panel{fill:#0b122b;stroke:#23355b;stroke-width:1}.wire{fill:none;stroke:#23355b;stroke-width:1.2}.active{fill:none;stroke:url(#neon);stroke-width:1.6}.flow{fill:none;stroke:#7ed9ff;stroke-width:2;stroke-dasharray:12 240;animation:flow 6s linear infinite}.glimmer{animation:glimmer 6s ease-in-out infinite}.gather{animation:gather 2.8s cubic-bezier(.2,.7,.2,1) both}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 40s linear infinite}@keyframes flow{to{stroke-dashoffset:-504}}@keyframes glimmer{0%,100%{opacity:.3}45%,65%{opacity:1}}@keyframes gather{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.flow{display:none}}
</style><rect width="400" height="740" rx="16" fill="#050817"/><rect width="400" height="740" rx="16" fill="url(#grid)"/><ellipse cx="231.99999999999997" cy="296.0" rx="208.0" ry="532.8" fill="url(#haze)"/>
<text x="24" y="42" font-size="11" class="muted mono" >CAPABILITIES / CONNECTIONS</text><text x="24" y="80" font-size="25" class="" font-weight="600">Your graph. Your workflow.</text><ellipse cx="200" cy="384" rx="165" ry="116" class="wire"/><ellipse cx="200" cy="384" rx="145" ry="96" class="wire" stroke-dasharray="2 8"/><path d="M200 244V324" class="active" marker-end="url(#arrow)"/><path d="M200 244V324" class="flow" aria-hidden="true"/><path d="M200 444V524" class="active" marker-end="url(#arrow)"/><path d="M200 444V524" class="flow" aria-hidden="true"/><rect x="24" y="116" width="352" height="128" rx="12" class="panel"/><text x="44" y="148" font-size="12" class="muted mono" >INPUTS</text><text x="44" y="180" font-size="18" class="" >graphify JSON · CRG SQLite</text><text x="44" y="211" font-size="14" class="muted" >Manual nodes &amp; edges: add / link</text><circle cx="200" cy="384" r="61" class="panel" stroke="url(#neon)"/><circle cx="200" cy="384" r="61" class="active"/><text x="200" y="389" font-size="21" class="" text-anchor="middle" font-weight="700">DirtyGraph</text><rect x="24" y="524" width="352" height="180" rx="12" class="panel"/><text x="44" y="556" font-size="12" class="muted mono" >ADAPTER ROUTES</text><text x="44" y="589" font-size="17" class="" >Local · echo / codegraph</text><text x="44" y="625" font-size="17" class="" >Compatible · DeepSeek / Qwen</text><text x="44" y="661" font-size="17" class="" >Custom · Python re_derive()</text></svg>