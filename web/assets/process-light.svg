<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="process-light-title process-light-desc">
<title id="process-light-title">Incremental recomputation</title><desc id="process-light-desc">Editing auth affects auth, session, views and api. Invoice, billing, search and logger remain unchanged; a second pass updates zero nodes.</desc>
<defs><linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="400"><stop stop-color="#2875c9"/><stop offset=".48" stop-color="#5855ca"/><stop offset="1" stop-color="#8050c5"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#b5c1ff" stop-opacity=".32"/><stop offset="1" stop-color="#f5f7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c5d0ef" stroke-opacity=".4" stroke-width=".6"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#829aff" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:Arial,'Noto Sans',sans-serif;fill:#12214a}.muted{fill:#53668d}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.panel{fill:#ffffff;stroke:#c5d0ef;stroke-width:1}.wire{fill:none;stroke:#c5d0ef;stroke-width:1.2}.active{fill:none;stroke:url(#neon);stroke-width:1.6}.flow{fill:none;stroke:#7ed9ff;stroke-width:2;stroke-dasharray:12 240;animation:flow 6s linear infinite}.glimmer{animation:glimmer 6s ease-in-out infinite}.gather{animation:gather 2.8s cubic-bezier(.2,.7,.2,1) both}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 40s linear infinite}@keyframes flow{to{stroke-dashoffset:-504}}@keyframes glimmer{0%,100%{opacity:.3}45%,65%{opacity:1}}@keyframes gather{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.flow{display:none}}
</style><rect width="1000" height="480" rx="16" fill="#f5f7ff"/><rect width="1000" height="480" rx="16" fill="url(#grid)"/><ellipse cx="580.0" cy="192.0" rx="520.0" ry="345.59999999999997" fill="url(#haze)"/>
<text x="40" y="46" font-size="12" class="muted mono" letter-spacing="2">ONE EDIT. A LOCAL CHAIN REACTS.</text><text x="40" y="89" font-size="30" class="" font-weight="600">Follow the dependency. Leave the rest.</text><path d="M220 195H300" class="active" marker-end="url(#arrow)"/><path d="M220 195H300" class="flow" aria-hidden="true"/><path d="M450 195H530" class="active" marker-end="url(#arrow)"/><path d="M450 195H530" class="flow" aria-hidden="true"/><path d="M680 195H760" class="active" marker-end="url(#arrow)"/><path d="M680 195H760" class="flow" aria-hidden="true"/><text x="70" y="141" font-size="12" class="muted mono" >01 / DIRECT</text><rect x="70" y="160" width="150" height="72" rx="10" class="panel"/><rect x="70" y="160" width="150" height="72" rx="10" fill="none" stroke="url(#neon)"/><text x="90" y="192" font-size="20" class="" font-weight="600">auth</text><text x="90" y="217" font-size="13" class="muted mono" >source changed</text><circle cx="202" cy="178" r="4" fill="#93b9ff" class="glimmer" style="animation-delay:0.0s"/><text x="300" y="141" font-size="12" class="muted mono" >02 / PROPAGATED</text><rect x="300" y="160" width="150" height="72" rx="10" class="panel"/><rect x="300" y="160" width="150" height="72" rx="10" fill="none" stroke="url(#neon)"/><text x="320" y="192" font-size="20" class="" font-weight="600">session</text><text x="320" y="217" font-size="13" class="muted mono" >dependent</text><circle cx="432" cy="178" r="4" fill="#93b9ff" class="glimmer" style="animation-delay:0.8s"/><text x="530" y="141" font-size="12" class="muted mono" >03 / PROPAGATED</text><rect x="530" y="160" width="150" height="72" rx="10" class="panel"/><rect x="530" y="160" width="150" height="72" rx="10" fill="none" stroke="url(#neon)"/><text x="550" y="192" font-size="20" class="" font-weight="600">views</text><text x="550" y="217" font-size="13" class="muted mono" >dependent</text><circle cx="662" cy="178" r="4" fill="#93b9ff" class="glimmer" style="animation-delay:1.6s"/><text x="760" y="141" font-size="12" class="muted mono" >04 / PROPAGATED</text><rect x="760" y="160" width="150" height="72" rx="10" class="panel"/><rect x="760" y="160" width="150" height="72" rx="10" fill="none" stroke="url(#neon)"/><text x="780" y="192" font-size="20" class="" font-weight="600">api</text><text x="780" y="217" font-size="13" class="muted mono" >dependent</text><circle cx="892" cy="178" r="4" fill="#93b9ff" class="glimmer" style="animation-delay:2.4000000000000004s"/><path d="M220 323H300" class="wire" marker-end="url(#arrow)"/><rect x="70" y="288" width="150" height="72" rx="10" class="panel"/><text x="90" y="320" font-size="20" class="" font-weight="600">invoice</text><text x="90" y="345" font-size="13" class="muted mono" >unchanged</text><rect x="300" y="288" width="150" height="72" rx="10" class="panel"/><text x="320" y="320" font-size="20" class="" font-weight="600">billing</text><text x="320" y="345" font-size="13" class="muted mono" >unchanged</text><rect x="530" y="288" width="150" height="72" rx="10" class="panel"/><text x="550" y="320" font-size="20" class="" font-weight="600">search</text><text x="550" y="345" font-size="13" class="muted mono" >unchanged</text><rect x="760" y="288" width="150" height="72" rx="10" class="panel"/><text x="780" y="320" font-size="20" class="" font-weight="600">logger</text><text x="780" y="345" font-size="13" class="muted mono" >unchanged</text><text x="70" y="402" font-size="13" class="muted mono" >DETECT → PROPAGATE → RE-DERIVE ALL 4 → CHECKPOINT</text><text x="70" y="438" font-size="15" class="muted mono" >8 source files   /   4 affected   /   4 untouched   /   next pass: 0</text></svg>