<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="architecture-light-title architecture-light-desc">
<title id="architecture-light-title">DirtyGraph architecture</title><desc id="architecture-light-desc">Existing graph and source hashes feed dependency propagation, then ordered adapters; Store checkpoints successful calls. Applications persist derived content.</desc>
<defs><linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="400"><stop stop-color="#2875c9"/><stop offset=".48" stop-color="#5855ca"/><stop offset="1" stop-color="#8050c5"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#b5c1ff" stop-opacity=".32"/><stop offset="1" stop-color="#f5f7ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c5d0ef" stroke-opacity=".4" stroke-width=".6"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#829aff" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:Arial,'Noto Sans',sans-serif;fill:#12214a}.muted{fill:#53668d}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.panel{fill:#ffffff;stroke:#c5d0ef;stroke-width:1}.wire{fill:none;stroke:#c5d0ef;stroke-width:1.2}.active{fill:none;stroke:url(#neon);stroke-width:1.6}.flow{fill:none;stroke:#7ed9ff;stroke-width:2;stroke-dasharray:12 240;animation:flow 6s linear infinite}.glimmer{animation:glimmer 6s ease-in-out infinite}.gather{animation:gather 2.8s cubic-bezier(.2,.7,.2,1) both}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 40s linear infinite}@keyframes flow{to{stroke-dashoffset:-504}}@keyframes glimmer{0%,100%{opacity:.3}45%,65%{opacity:1}}@keyframes gather{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.flow{display:none}}
</style><rect width="1000" height="540" rx="16" fill="#f5f7ff"/><rect width="1000" height="540" rx="16" fill="url(#grid)"/><ellipse cx="580.0" cy="216.0" rx="520.0" ry="388.8" fill="url(#haze)"/>
<text x="40" y="48" font-size="12" class="muted mono" letter-spacing="2">THE INCREMENTAL ENGINE</text><text x="40" y="88" font-size="30" class="" font-weight="600">A small engine. A precise update.</text><text x="40" y="140" font-size="12" class="muted mono" >01 / INPUT</text><text x="360" y="140" font-size="12" class="muted mono" >02 / INVALIDATE</text><text x="680" y="140" font-size="12" class="muted mono" >03 / RE-DERIVE</text><path d="M300 210H360" class="active" marker-end="url(#arrow)"/><path d="M300 210H360" class="flow" aria-hidden="true"/><path d="M300 314H360" class="active" marker-end="url(#arrow)"/><path d="M300 314H360" class="flow" aria-hidden="true"/><path d="M620 210H680" class="active" marker-end="url(#arrow)"/><path d="M620 210H680" class="flow" aria-hidden="true"/><path d="M490 278V246" class="active" marker-end="url(#arrow)"/><path d="M490 278V246" class="flow" aria-hidden="true"/><path d="M960 210H972Q980 210 980 218V388Q980 396 972 396H592Q584 396 584 404V424" class="active" marker-end="url(#arrow)"/><path d="M960 210H972Q980 210 980 218V388Q980 396 972 396H592Q584 396 584 404V424" class="flow" aria-hidden="true"/><path d="M420 424V350" class="wire" marker-end="url(#arrow)"/><rect x="40" y="174" width="260" height="72" rx="10" class="panel"/><text x="60" y="206" font-size="20" class="" font-weight="600">Existing graph</text><text x="60" y="231" font-size="13" class="muted mono" >JSON / SQLite</text><rect x="40" y="278" width="260" height="72" rx="10" class="panel"/><text x="60" y="310" font-size="20" class="" font-weight="600">Source files</text><text x="60" y="335" font-size="13" class="muted mono" >File-level provenance</text><rect x="360" y="174" width="260" height="72" rx="10" class="panel"/><rect x="360" y="174" width="260" height="72" rx="10" fill="none" stroke="url(#neon)"/><text x="380" y="206" font-size="20" class="" font-weight="600">DepGraph + dirty</text><text x="380" y="231" font-size="13" class="muted mono" >Reachability · explain why</text><rect x="360" y="278" width="260" height="72" rx="10" class="panel"/><text x="380" y="310" font-size="20" class="" font-weight="600">BLAKE3 detection</text><text x="380" y="335" font-size="13" class="muted mono" >Content hashes → dirty set</text><rect x="680" y="174" width="280" height="72" rx="10" class="panel"/><rect x="680" y="174" width="280" height="72" rx="10" fill="none" stroke="url(#neon)"/><text x="700" y="206" font-size="20" class="" font-weight="600">Rederive engine</text><text x="700" y="231" font-size="13" class="muted mono" >Topological calls → adapter</text><text x="694" y="293" font-size="14" class="mono" >DerivedContent → application</text><text x="694" y="319" font-size="13" class="muted" >Application owns output persistence</text><rect x="360" y="424" width="260" height="72" rx="10" class="panel"/><text x="380" y="456" font-size="20" class="" font-weight="600">Store · sidecar</text><text x="380" y="481" font-size="13" class="muted mono" >Hashes · dirty bits</text><text x="670" y="431" font-size="13" class="muted mono" >✓ successful calls checkpointed</text><text x="670" y="456" font-size="13" class="muted mono" >↻ failed calls stay dirty</text></svg>