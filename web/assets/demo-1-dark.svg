<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" role="img" aria-labelledby="title desc"><title id="title">DirtyGraph: eight-node example</title><desc id="desc">Editing auth affects auth, session, views and api. Invoice, billing, search and logger are unchanged. Arrows show change propagation.</desc><rect width="760" height="266" fill="#1d211d"/><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a9afa2" stroke-width="1.4"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.flow{stroke-dasharray:6 5;animation:flow 3s linear infinite}@keyframes flow{to{stroke-dashoffset:-44}}@media(prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}}</style><text x="32" y="28" fill="#a9afa2" font-size="16">CHANGE PROPAGATION</text><text x="32" y="149" fill="#a9afa2" font-size="16">UNCHANGED</text><path d="M176 81 H206" fill="none" stroke="#e6b365" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360 81 H390" fill="none" stroke="#e6b365" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M544 81 H574" fill="none" stroke="#e6b365" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M176 195 H206" fill="none" stroke="#a9afa2" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="32" y="54" width="144" height="54" rx="5" fill="#443623" stroke="#e6b365" stroke-width="1.5"/><text x="104" y="89" text-anchor="middle" fill="#f0f1e9" font-size="25" font-weight="500">auth</text><text x="104" y="130" text-anchor="middle" fill="#e6b365" font-size="17">changed</text><rect x="216" y="54" width="144" height="54" rx="5" fill="#443623" stroke="#e6b365" stroke-width="1.5"/><text x="288" y="89" text-anchor="middle" fill="#f0f1e9" font-size="25" font-weight="500">session</text><text x="288" y="130" text-anchor="middle" fill="#e6b365" font-size="17">affected</text><rect x="400" y="54" width="144" height="54" rx="5" fill="#443623" stroke="#e6b365" stroke-width="1.5"/><text x="472" y="89" text-anchor="middle" fill="#f0f1e9" font-size="25" font-weight="500">views</text><text x="472" y="130" text-anchor="middle" fill="#e6b365" font-size="17">affected</text><rect x="584" y="54" width="144" height="54" rx="5" fill="#443623" stroke="#e6b365" stroke-width="1.5"/><text x="656" y="89" text-anchor="middle" fill="#f0f1e9" font-size="25" font-weight="500">api</text><text x="656" y="130" text-anchor="middle" fill="#e6b365" font-size="17">affected</text><rect x="32" y="168" width="144" height="54" rx="5" fill="#1d211d" stroke="#485044" stroke-width="1.5"/><text x="104" y="203" text-anchor="middle" fill="#f0f1e9" font-size="25" font-weight="500">invoice</text><text x="104" y="244" text-anchor="middle" fill="#a9afa2" font-size="17">clean</text><rect x="216" y="168" width="144" height="54" rx="5" fill="#1d211d" stroke="#485044" stroke-width="1.5"/><text x="288" y="203" text-anchor="middle" fill="#f0f1e9" font-size="25" font-weight="500">billing</text><text x="288" y="244" text-anchor="middle" fill="#a9afa2" font-size="17">clean</text><rect x="400" y="168" width="144" height="54" rx="5" fill="#1d211d" stroke="#485044" stroke-width="1.5"/><text x="472" y="203" text-anchor="middle" fill="#f0f1e9" font-size="25" font-weight="500">search</text><text x="472" y="244" text-anchor="middle" fill="#a9afa2" font-size="17">clean</text><rect x="584" y="168" width="144" height="54" rx="5" fill="#1d211d" stroke="#485044" stroke-width="1.5"/><text x="656" y="203" text-anchor="middle" fill="#f0f1e9" font-size="25" font-weight="500">logger</text><text x="656" y="244" text-anchor="middle" fill="#a9afa2" font-size="17">clean</text></svg>