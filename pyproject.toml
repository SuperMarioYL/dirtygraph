[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dirtygraph"
version = "0.1.0"
description = "Bazel-style dirty-marking for agent code knowledge-graphs: edit one file, re-derive only the stale closure instead of re-scanning the whole graph."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "SuperMarioYL" }]
keywords = [
    "knowledge-graph",
    "incremental",
    "dirty-marking",
    "agent",
    "codebase",
    "networkx",
    "deepseek",
    "qwen",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "networkx>=3.3,<4",
    "watchdog>=4.0,<5",
    "typer>=0.12,<1",
    "pyyaml>=6.0,<7",
    "blake3>=0.4,<1",
]

[project.urls]
Homepage = "https://github.com/SuperMarioYL/dirtygraph"
Repository = "https://github.com/SuperMarioYL/dirtygraph"
Issues = "https://github.com/SuperMarioYL/dirtygraph/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dirtygraph = "dirtygraph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["dirtygraph"]

[tool.hatch.version]
path = "dirtygraph/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
